<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First AWS Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f1f5f9;
            color: #1e293b;
        }
        main {
            max-width: 700px;
            margin: 80px auto;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px #00000012;
            text-align: center;
        }
        h1 { color: #2563eb; }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <main>
        <h1>My First AWS Website</h1>
        <p>Developed on my desktop and deployed automatically using GitHub and AWS Amplify.</p>
        <a href="https://aws.amazon.com/" target="_blank" rel="noopener">
            Learn about AWS
        </a>
    </main>
</body>
</html>
