---
- name: Prepare the EC2 server for the DevOps lab
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Allow Jenkins to use Docker
      ansible.builtin.user:
        name: jenkins
        groups: docker
        append: true